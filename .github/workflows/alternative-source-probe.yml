name: One-Time Alternative Music Source Probe
on:
  push:
    paths:
      - '.github/workflows/alternative-source-probe.yml'
      - 'tests/live_source_probe.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe public licensed audio catalogs without downloading media
        run: python tests/live_source_probe.py
