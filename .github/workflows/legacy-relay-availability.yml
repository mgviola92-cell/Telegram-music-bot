name: Bounded Legacy Relay Availability Probe
on:
  pull_request:
    paths:
      - '.github/workflows/legacy-relay-availability.yml'
  workflow_dispatch:
jobs:
  relay_probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check legacy relay GET/POST and Vapters, without downloading media
        run: |
          python - <<'PY'
          import json,urllib.request,urllib.error,time,socket
          base='https://cold-lemming-3841.alexainc.deno.net'
          video='https://www.youtube.com/watch?v=jNQXAC9IVRw'
          requests=[
            ('legacy_health',urllib.request.Request(base+'/health',headers={'Accept':'application/json'})),
            ('legacy_download_GET',urllib.request.Request(base+'/download',headers={'Accept':'application/json'})),
            ('legacy_download_POST',urllib.request.Request(base+'/download',
                data=json.dumps({'url':video,'type':'audio'},separators=(',',':')).encode(),
                headers={'Content-Type':'application/json','Accept':'audio/*'})),
            ('vapters_sample',urllib.request.Request(
                'https://vapters.site/stream/jNQXAC9IVRw?vid=false&quality=128',
                headers={'User-Agent':'MusicBotAudio/1.0','Accept':'audio/*'})),
          ]
          for name,request in requests:
            started=time.monotonic()
            try:
              with urllib.request.urlopen(request,timeout=9) as response:
                contenttype=response.headers.get('Content-Type','').split(';')[0]
                sample=response.read(1536)
                print(json.dumps({'name':name,'status':response.status,'content_type':contenttype,
                    'bytes':len(sample),'first_byte_s':round(time.monotonic()-started,2)}),flush=True)
            except urllib.error.HTTPError as error:
              print(json.dumps({'name':name,'http_status':error.code,
                    'elapsed_s':round(time.monotonic()-started,2)}),flush=True)
            except Exception as error:
              print(json.dumps({'name':name,'error_type':type(error).__name__,
                    'elapsed_s':round(time.monotonic()-started,2)}),flush=True)
          PY

      - name: Install FFmpeg for actual short PCM decode
        run: sudo timeout 100s apt-get install -y ffmpeg
      - name: Check Audius read-only catalog availability
        run: |
          python - <<'PY'
          import urllib.request,urllib.error,time,json
          started=time.monotonic()
          try:
              url='https://api.audius.co/v1/tracks/search?query=electronic&limit=1&app_name=mudyar-music'
              with urllib.request.urlopen(urllib.request.Request(url,headers={
                  'Accept':'application/json','User-Agent':'MudyarMusicBot/1.0'}),timeout=9) as response:
                  data=json.load(response)
                  print(json.dumps({'audius_status':response.status,
                     'tracks_count':len(data.get('data',[])),
                     'elapsed_s':round(time.monotonic()-started,2)}))
          except urllib.error.HTTPError as error:
              print(json.dumps({'audius_status':error.code,
                  'elapsed_s':round(time.monotonic()-started,2)}))
          except Exception as error:
              print(json.dumps({'audius_error_type':type(error).__name__,
                  'elapsed_s':round(time.monotonic()-started,2)}))
          PY
      - name: Check optional authenticated NubCoders with bounded PCM sample
        env:
          NUBCODERS_API_TOKEN: ${{ secrets.NUBCODERS_API_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.parse,urllib.error,subprocess,time
          token=os.environ.get('NUBCODERS_API_TOKEN')
          if not token:
              print('nubcoders_token_present false');quit()
          print('nubcoders_token_present true')
          url='https://api.nubcoders.com/stream?'+urllib.parse.urlencode({
              'q':'jNQXAC9IVRw','mode':'audio','redirect':'false'})
          started=time.monotonic()
          try:
              request=urllib.request.Request(url,headers={
                  'Authorization':'Bearer '+token,'Accept':'application/json'})
              with urllib.request.urlopen(request,timeout=10) as response:
                  obj=json.load(response)
                  status=response.status
              signed=obj.get('stream_url') or obj.get('url')
              print(json.dumps({'nub_api_status':status,
                  'has_signed_stream':isinstance(signed,str),
                  'resolve_s':round(time.monotonic()-started,2)}))
              if isinstance(signed,str) and signed.startswith('https://'):
                  from urllib.parse import urlsplit
                  if urlsplit(signed).hostname != 'api.nubcoders.com':
                      raise ValueError('unexpected signed source host')
                  command=['ffmpeg','-hide_banner','-nostdin','-loglevel','quiet',
                      '-rw_timeout','7000000','-i',signed,'-t','0.15',
                      '-vn','-ac','1','-ar','16000','-f','s16le','pipe:1']
                  out=subprocess.run(command,capture_output=True,timeout=15)
                  print(json.dumps({'nub_pcm_bytes':len(out.stdout),'ffmpeg_exit':out.returncode,
                      'decoder_s':round(time.monotonic()-started,2)}))
          except Exception as error:
              print(json.dumps({'nub_api_failure_type':type(error).__name__,
                   'status':getattr(error,'code',None),
                   'elapsed_s':round(time.monotonic()-started,2)}))
          PY
