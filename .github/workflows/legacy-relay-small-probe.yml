name: Legacy Relay Small Feasibility Probe
on:
  pull_request:
    paths:
      - '.github/workflows/legacy-relay-small-probe.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe public relay without downloading entire media
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error, time
          base='https://cold-lemming-3841.alexainc.deno.net'
          reqs=[
            ('health',urllib.request.Request(base+'/health',headers={'User-Agent':'MudyarTrial/1.0'})),
            ('download',urllib.request.Request(base+'/download',data=json.dumps({'url':'https://www.youtube.com/watch?v=jNQXAC9IVRw','type':'audio'}).encode(),headers={'Content-Type':'application/json','User-Agent':'MudyarTrial/1.0'},method='POST'))
          ]
          for kind,req in reqs:
            t=time.monotonic()
            try:
              with urllib.request.urlopen(req,timeout=12) as resp:
                body=resp.read(4096)
                print(json.dumps({'kind':kind,'status':resp.status,'content_type':resp.headers.get('Content-Type','').split(';')[0],'bytes':len(body),'elapsed_s':round(time.monotonic()-t,3)}))
            except urllib.error.HTTPError as e:
              print(json.dumps({'kind':kind,'status':e.code,'elapsed_s':round(time.monotonic()-t,3)}))
            except Exception as e:
              print(json.dumps({'kind':kind,'error':type(e).__name__,'elapsed_s':round(time.monotonic()-t,3)}))
          PY
