name: Native VC Compatibility Matrix
on:
  pull_request:
    paths:
      - '.github/workflows/native-vc-matrix.yml'
  workflow_dispatch:
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        version: ['2.3.3','3.0.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated native libraries
        run: python -m pip install "py-tgcalls==${{ matrix.version }}" 'pyrogrammod==2.4.1'
      - name: Inspect concrete native API contract without connecting Telegram
        run: |
          python - <<'PY'
          import json,inspect,importlib.metadata as md
          from pytgcalls import PyTgCalls
          from pytgcalls.types import MediaStream,GroupCallConfig
          from ntgcalls import ConnectionMode
          row={'version':md.version('py-tgcalls'),'native_version':md.version('ntgcalls')}
          for method in ('play','resume','unmute','leave_call','pause','mute'):
              obj=getattr(PyTgCalls,method,None)
              row[method]={'exists':obj is not None,'async':inspect.iscoroutinefunction(obj),'signature':str(inspect.signature(obj))[:180] if obj else None}
          for thing,obj in [('MediaStream',MediaStream),('GroupCallConfig',GroupCallConfig)]:
              row[thing]=str(inspect.signature(obj))[:250]
          for value in ('RTC','STREAM'):
              row['mode_'+value]=hasattr(ConnectionMode,value)
          print(json.dumps(row,default=str))
          PY

      - name: Run current VC transport unit tests under native version
        run: |
          python -m pip install 'aiohttp>=3.10,<4' 'yt-dlp>=2025.1.15,<2027' 'edge-tts>=7.2,<8' 'TgCrypto==1.2.5'
          python -m unittest discover -s tests -p 'test_voice_transport.py' -v
          python -m unittest discover -s tests -p 'test_source_race.py' -v
          python -m unittest discover -s tests -p 'test_provider_health.py' -v

      - name: Install FFmpeg for real decoder tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Run full compatibility suite under selected native version
        run: |
          python -m pip install 'yt-dlp-ejs==0.8.0' 'deno==2.9.7'
          python -m unittest discover -s tests -p 'test_*.py' -q
