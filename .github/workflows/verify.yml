name: Verify Music Bot Python
on:
  push:
    branches: [main]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python sources
        run: python -m py_compile main.py generate_session.py audius_source.py song_cache.py music_ui.py idle_media.py youtube_health.py archive_source.py prefetch.py direct_stream.py player_visuals.py stream_probe.py network_audio.py bot_source_probe.py lybot_source.py voice_transport.py source_race.py track_metadata.py queue_receipts.py song_recognition.py audio_options.py music_search.py music_stats.py music_cleanup.py feature_probe.py radio_catalog.py welcome_audio.py radio_welcome_probe.py music_owner_store.py music_owner_ui.py greeting_recordings.py owner_broadcast.py private_songs.py lyrics_service.py effect_probe.py
      - name: Install music dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify optional MTProto crypto acceleration is installed
        run: python -c "import tgcrypto; print('TgCrypto acceleration available')"
      - name: Install FFmpeg for real audio decode tests
        run: |
          python -m pip install 'imageio-ffmpeg==0.6.0'
          python - <<'PY'
          import os
          from pathlib import Path
          from imageio_ffmpeg import get_ffmpeg_exe
          source = Path(get_ffmpeg_exe())
          folder = Path(os.environ['RUNNER_TEMP']) / 'music-ffmpeg'
          folder.mkdir(parents=True, exist_ok=True)
          (folder / 'ffmpeg').symlink_to(source)
          with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as out:
              out.write(str(folder) + '\\n')
          print('FFmpeg ready for real decode tests:', source.name)
          PY
      - name: Test media download and source filtering
        run: python -m unittest discover -s tests -v
      - name: Verify PyTgCalls / Pyrogram compatibility
        run: python -c "from pyrogram.errors import GroupcallForbidden; from pytgcalls import PyTgCalls; from pytgcalls.types import MediaStream, StreamEnded, GroupCallConfig; from yt_dlp import YoutubeDL; from main import is_youtube_url; assert is_youtube_url('https://www.youtube.com/watch?v=demo') and not is_youtube_url('http://127.0.0.1/test')"
