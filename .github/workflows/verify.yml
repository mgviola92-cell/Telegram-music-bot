name: Verify Music Bot Python
on:
  push:
    branches: [main]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python sources
        run: python -m py_compile main.py generate_session.py
      - name: Install music dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify PyTgCalls / Pyrogram compatibility
        run: python -c "from pyrogram.errors import GroupcallForbidden; from pytgcalls import PyTgCalls; from pytgcalls.types import MediaStream, StreamEnded, GroupCallConfig; from yt_dlp import YoutubeDL; from main import is_youtube_url; assert is_youtube_url(\u0027https://www.youtube.com/watch?v=demo\u0027) and not is_youtube_url(\u0027http://127.0.0.1/test\u0027)"
