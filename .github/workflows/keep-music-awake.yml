name: Keep Music Bot Awake

# Render Free web instances sleep without incoming HTTP requests. Telegram
# long-polling does not itself count as incoming web traffic.
# Cron scheduling on GitHub Actions is best effort, not a 24/7 guarantee.
on:
  schedule:
    - cron: '3-58/5 * * * *'
  push:
    paths:
      - '.github/workflows/keep-music-awake.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: music-bot-health-ping
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping only Music Bot's Render health endpoint
        run: |
          curl --silent --show-error --fail-with-body \
            --connect-timeout 15 --max-time 100 \
            --retry 2 --retry-delay 10 --retry-all-errors \
            "https://telegram-music-bot-tpvb.onrender.com/health"
