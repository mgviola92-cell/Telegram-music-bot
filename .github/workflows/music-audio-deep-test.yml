name: Music Audio Deep Test (Isolated)
on:
  pull_request:
    paths:
      - '.github/workflows/music-audio-deep-test.yml'
  workflow_dispatch:
jobs:
  audius_decode:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Resolve Audius and decode brief PCM sample
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,json,subprocess,time
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'MudyarMusicTrial/1.0'}),timeout=10) as r:
                  return json.loads(r.read(150000))
          try:
              host=get('https://api.audius.co')['data'][0].rstrip('/')
              rows=get(host+'/v1/tracks/search?query=electronic&limit=1&app_name=MudyarMusicTrial')['data']
              assert rows and rows[0].get('id')
              url=host+'/v1/tracks/'+rows[0]['id']+'/stream?app_name=MudyarMusicTrial'
              for i in range(2):
                  t=time.monotonic()
                  p=subprocess.run(['ffmpeg','-hide_banner','-nostdin','-loglevel','error','-rw_timeout','9000000','-i',url,'-t','1','-f','s16le','-ac','1','-ar','16000','pipe:1'],capture_output=True,timeout=23)
                  print(json.dumps({'trial':i+1,'pcm_bytes':len(p.stdout),'nonzero':any(p.stdout),'elapsed':round(time.monotonic()-t,3),'returncode':p.returncode,'stderr_tail':p.stderr.decode(errors='replace')[-120:]}))
          except Exception as e: print(json.dumps({'error':type(e).__name__,'detail':str(e)[:160]}))
          PY
  public_code_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch exact reference repository metadata and files (read only)
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,json
          for name in ['TeamYukki/YukkiMusicBot','nub-coders/music-bot']:
              try:
                  req=urllib.request.Request('https://api.github.com/repos/'+name,headers={'User-Agent':'MudyarMusicTrial/1.0'})
                  with urllib.request.urlopen(req,timeout=12) as r: j=json.load(r)
                  print(json.dumps({'repo':name,'branch':j.get('default_branch'),'archived':j.get('archived'),'pushed_at':j.get('pushed_at'),'license':(j.get('license') or {}).get('spdx_id'),'open_issues_count':j.get('open_issues_count')}))
              except Exception as e: print(json.dumps({'repo':name,'error':type(e).__name__}))
          PY
