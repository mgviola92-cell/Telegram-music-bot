name: Provider Diagnostics (Manual Trial)
on:
  pull_request:
    paths:
      - '.github/workflows/provider-diagnostics.yml'
  workflow_dispatch:
jobs:
  public_provider_probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe provider availability without credentials or full downloads
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, time, json
          tests = [
             ("nub_health", "https://api.nubcoders.com/health", 4096),
             ("nub_search", "https://api.nubcoders.com/search?q=Attention&limit=1", 8192),
             ("vapters_audio", "https://vapters.site/stream/nfs8NYg7yQM?vid=false&quality=128", 32768),
          ]
          for name, url, limit in tests:
              start=time.monotonic()
              try:
                  req=urllib.request.Request(url, headers={"User-Agent":"MusicBotDiagnostic/1.0"})
                  with urllib.request.urlopen(req,timeout=12) as response:
                      data=response.read(limit)
                      print(json.dumps(dict(name=name,status=response.status,elapsed_sec=round(time.monotonic()-start,3),bytes=len(data),content_type=response.headers.get("content-type","")),ensure_ascii=False))
              except Exception as exc:
                  print(json.dumps(dict(name=name,error=type(exc).__name__,detail=str(exc)[:110],elapsed_sec=round(time.monotonic()-start,3))))
          PY
